<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>レインボー水族館｜海のいのちは、すごいんだ！</title>
    <meta name="robots" content="none" />
  </head>
  <body>
    <div id="header"></div>

    <main id="top">
      <div id="mainVisual">
        <div class="slide img1 active"></div>
        <div class="slide img2"></div>
        <div class="slide img3"></div>
        <div class="slide img4"></div>
        <div class="main-visual-text">
          <h1>海のいのちは<br />すごいんだ！</h1>
          <div class="main-time">
            <h2>営業時間</h2>
            <p class="eigyou-time">
              <time datetime="10:00">10:00</time>～<time datetime="17:00"
                >17:00</time
              >
            </p>
            <div class="time-syosai">
              <p>年中無休</p>
              <p>※入場は<br />閉場30分前まで</p>
            </div>
          </div>
        </div>
      </div>

      <div class="wrap">
        <div class="bgwrap">
          <nav class="top-nav">
            <ul>
              <li>
                <a href="event.html"
                  ><img src="img/eventbtn.png" alt="イベント"
                /></a>
              </li>
              <li>
                <a href="ikimono.html"
                  ><img src="img/ikimonobtn.png" alt="いきもの紹介"
                /></a>
              </li>
              <li>
                <a href="shop.html"
                  ><img src="img/sopbtn.png" alt="ショップ"
                /></a>
              </li>
              <li>
                <a href="acces.html"
                  ><img src="img/accesbtn.png" alt="アクセス"
                /></a>
              </li>
            </ul>
          </nav>
        </div>
        <section class="news">
          <h2>News おしらせ</h2>
          <dl>
            <div class="newslist">
              <dt><time datetime="2026-03-17">2026-3-17</time></dt>
              <dd>春の催し！メダカフェス！</dd>
            </div>
            <div class="newslist">
              <dt><time datetime="2026-02-20">2026-2-20</time></dt>
              <dd>ペンギンの赤ちゃんが生まれました！</dd>
            </div>
            <div class="newslist">
              <dt><time datetime="2026-01-25">2026-1-25</time></dt>
              <dd>
                オリジナルカプセルトイ「レインボーSea Gangs vol.3」発売開始！
              </dd>
            </div>
            <div class="newslist">
              <dt><time datetime="2026-12-25">2026-12-25</time></dt>
              <dd>本年も大変お世話になりました！</dd>
            </div>
          </dl>
        </section>

        <section class="ikimono">
          <div class="ikimono-img"><img src="img/shachi 1.png" alt="" /></div>
          <div class="ikimono-text">
            <h2>海のいのち<br />どんないのち？</h2>
            <!-- pagelink -->
            <div class="toikimono">
              <a href="ikimono.html"
                ><p>いきもの紹介</p>
                <img src="img/alow.png" alt=""
              /></a>
            </div>
          </div>
        </section>

        <section class="toevent">
          <!-- 1grid -->
          <div class="event-container">
            <div class="event-cham"><img src="img/fish.png" alt="" /></div>
            <div class="event-img">
              <img src="img/mainevent1.jpg" alt="魚を食べるアザラシ" />
            </div>
            <div class="abs-title"><h3>パクパクタイム</h3></div>
            <div class="event-text">
              <p>
                ゴマフアザラシ・コツメカワウソ・ケープペンギンがエサを食べる様子を目の前で観察できます。
              </p>
            </div>
          </div>
          <!--  -->
        </section>
      </div>
      <div class="fixedbg"></div>

    <div id="footer"></div>

    <script src="js/script.js"></script>
